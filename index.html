<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 數位賦能工作坊報名</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>

  <style>
    /* 專業簡約風格 CSS */
    body { background-color: #f5f5f5; }
    .page-content {
      max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 32px;
      box-shadow: 0 2px 2px 0 rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.2), 0 1px 5px 0 rgba(0,0,0,.12);
    }
    h2 { text-align: center; color: #3f51b5; margin-top: 0; font-weight: 300; }
    .mdl-textfield { width: 100%; }
    .mdl-button-submit { width: 100%; margin-top: 20px; }
    #response-message {
      text-align: center; padding: 15px; margin-top: 20px; display: none; border-radius: 4px; font-weight: bold;
    }
    .success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .error { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  </style>
</head>
<body>

<div class="page-content">
  <div class="mdl-typography--text-center">
    <h2>AI 數位賦能工作坊</h2>
    <p>請填寫以下資訊以完成報名：</p>
  </div>
  
  <form id="registrationForm">
    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
      <input class="mdl-textfield__input" type="text" id="department" name="department" required>
      <label class="mdl-textfield__label" for="department">部門單位</label>
    </div>
    
    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
      <input class="mdl-textfield__input" type="text" id="name" name="name" required>
      <label class="mdl-textfield__label" for="name">姓名</label>
    </div>

    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
      <input class="mdl-textfield__input" type="text" id="title" name="title" required>
      <label class="mdl-textfield__label" for="title">職稱</label>
    </div>

    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
      <input class="mdl-textfield__input" type="email" id="email" name="email" required>
      <label class="mdl-textfield__label" for="email">電子信箱</label>
      <span class="mdl-textfield__error">請輸入有效的電子信箱</span>
    </div>

    <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--colored mdl-button-submit" id="submitButton">
      立即報名
    </button>
  </form>

  <div id="response-message"></div>

</div>

<script>
  document.getElementById('registrationForm').addEventListener('submit', function(e) {
    e.preventDefault(); 
    
    const form = e.target;
    const button = document.getElementById('submitButton');
    const messageDiv = document.getElementById('response-message');
    
    // 鎖定按鈕並更新文字
    button.disabled = true;
    button.innerText = '送出中...';
    messageDiv.style.display = 'none';

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    // 🚨 這是您的 Apps Script 部署網址，請確認是最新版本！
    const GAS_URL = 'https://script.google.com/macros/s/AKfycby2_qa4Zo6TYDIX1_ja0uyXHN-TQ8a5uYXnswcrNbxW7YFLjsTC-yBiNV23c0_044bV7g/exec';

    fetch(GAS_URL, {
        method: 'POST',
        mode: 'cors', 
        cache: 'no-cache',
        headers: {
            'Content-Type': 'application/json' 
        },
        body: JSON.stringify(data) // 發送 JSON 格式資料
    })
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return response.json();
    })
    .then(response => {
        // 處理伺服器回傳的結果
        button.disabled = false;
        button.innerText = '立即報名';
        messageDiv.textContent = response.message;
        
        if (response.success) {
            messageDiv.className = 'success';
            form.reset(); 
            if (typeof componentHandler !== 'undefined') {
                componentHandler.upgradeElements(form);
            }
        } else {
            messageDiv.className = 'error';
        }
        messageDiv.style.display = 'block';
    })
    .catch(error => {
        // 處理連線或網路錯誤
        button.disabled = false;
        button.innerText = '立即報名';
        messageDiv.textContent = '❌ 網路連線錯誤，或伺服器端發生問題。';
        messageDiv.className = 'error';
        messageDiv.style.display = 'block';
        console.error('Submission Error:', error);
    });
});
</script>

</body>
</html>
