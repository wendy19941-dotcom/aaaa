<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>

  <style>
    /* 自訂 CSS 樣式 */
    body {
      background-color: #f5f5f5; /* 輕微的灰色背景 */
    }
    .page-content {
      max-width: 600px; /* 限制內容最大寬度 */
      margin: 40px auto;
      background-color: #ffffff;
      padding: 32px;
      box-shadow: 0 2px 2px 0 rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.2), 0 1px 5px 0 rgba(0,0,0,.12);
    }
    h2 {
      text-align: center;
      color: #3f51b5; /* 主要顏色 */
      margin-top: 0;
      font-weight: 300;
    }
    .mdl-textfield {
      width: 100%;
    }
    .mdl-button-submit {
      width: 100%;
      margin-top: 20px;
    }
    #response-message {
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      display: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }
    .error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
  </style>
</head>
<body>

<div class="page-content">
  <div class="mdl-typography--text-center">
    <h2>AI 數位賦能工作坊</h2>
    <p>請填寫以下資訊以完成報名：</p>
  </div>
  
  <form id="registrationForm">
    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
      <input class="mdl-textfield__input" type="text" id="department" name="department" required>
      <label class="mdl-textfield__label" for="department">部門單位 (例如：資訊技術部)</label>
    </div>
    
    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
      <input class="mdl-textfield__input" type="text" id="name" name="name" required>
      <label class="mdl-textfield__label" for="name">姓名</label>
    </div>

    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
      <input class="mdl-textfield__input" type="text" id="title" name="title" required>
      <label class="mdl-textfield__label" for="title">職稱 (例如：經理)</label>
    </div>

    <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
      <input class="mdl-textfield__input" type="email" id="email" name="email" required>
      <label class="mdl-textfield__label" for="email">電子信箱</label>
      <span class="mdl-textfield__error">請輸入有效的電子信箱</span>
    </div>

    <button type="submit" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--colored mdl-button-submit" id="submitButton">
      立即報名
    </button>
  </form>

  <div id="response-message"></div>

</div>

<script>
  document.getElementById('registrationForm').addEventListener('submit', function(e) {
    e.preventDefault(); // 阻止表單傳統提交
    
    const form = e.target;
    const button = document.getElementById('submitButton');
    const messageDiv = document.getElementById('response-message');
    
    // 禁用按鈕並更新文字
    button.disabled = true;
    button.innerText = '送出中...';
    messageDiv.style.display = 'none'; // 隱藏前一次訊息

    // 將表單數據轉換為物件
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    // 調用 Apps Script 伺服器端的 processForm 函式
    // Google Apps Script 的 google.script.run 是非同步的
    google.script.run
      .withSuccessHandler(function(response) {
        // 處理成功回傳的結果
        button.disabled = false;
        button.innerText = '立即報名';
        
        messageDiv.textContent = response.message;
        
        if (response.success) {
          messageDiv.className = 'success';
          form.reset(); // 成功後清空表單
          // 重新升級 MDL 樣式（確保重置後樣式正確）
          componentHandler.upgradeElements(form);
        } else {
          messageDiv.className = 'error';
        }
        
        messageDiv.style.display = 'block';
      })
      .withFailureHandler(function(error) {
        // 處理失敗回傳的結果 (例如伺服器錯誤)
        button.disabled = false;
        button.innerText = '立即報名';
        messageDiv.textContent = '發生連線錯誤：' + error.message;
        messageDiv.className = 'error';
        messageDiv.style.display = 'block';
      })
      .processForm(data); // 呼叫 Code.gs 中的 processForm 函式
  });
</script>

</body>
</html>
